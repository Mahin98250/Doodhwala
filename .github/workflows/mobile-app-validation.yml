name: Mobile app validation

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-app-validation.yml"
  push:
    branches:
      - main
      - "architecture/nextjs-migration-foundation"
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-app-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Export Android bundle
        run: npx expo export --platform android --output-dir dist/android
      - name: Export iOS bundle
        run: npx expo export --platform ios --output-dir dist/ios
