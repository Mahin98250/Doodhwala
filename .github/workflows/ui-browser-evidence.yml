name: UI browser viewport evidence

concurrency:
  group: ui-browser-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "customer-nav.js"
      - "app.js"
      - "customer-journey-refresh.css"
      - "customer-ui-polish.css"
      - "marketplace-refresh.css"
      - "scripts/test-ui-browser-smoke.mjs"
      - ".github/workflows/ui-browser-evidence.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "customer-nav.js"
      - "app.js"
      - "customer-journey-refresh.css"
      - "customer-ui-polish.css"
      - "marketplace-refresh.css"
      - "scripts/test-ui-browser-smoke.mjs"
      - ".github/workflows/ui-browser-evidence.yml"

jobs:
  viewport-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Chromium test runner
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install chromium
      - name: Start local static server
        run: |
          python3 -m http.server 4173 --directory "$GITHUB_WORKSPACE/.." > /tmp/doodhwala-http.log 2>&1 &
          echo $! > /tmp/doodhwala-http.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/Doodhwala/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/doodhwala-http.log
          exit 1
      - name: Run real Chromium viewport checks
        run: node scripts/test-ui-browser-smoke.mjs
      - name: Upload screenshots and viewport findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doodhwala-ui-browser-evidence
          path: artifacts/ui/
          if-no-files-found: warn
          retention-days: 14
