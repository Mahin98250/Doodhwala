name: Static validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          set -e
          for file in app.js auth.js checkout.js checkout-10x.js provider.js provider-10x.js supabase-client.js supabase-config.js sw.js orders.js direct-upi-checkout.js plans.js admin.js admin-intelligence.js store.js product.js customer-nav.js customer-10x.js customer-market-10x.js location.js provider-location.js resilience.js pwa-register.js session-controls.js support.js network-status.js; do
            node --check "$file"
          done
      - name: Syntax-check production readiness probe
        run: node --check scripts/production-readiness-probe.mjs
      - name: Syntax-check live page smoke test
        run: node --check scripts/live-page-smoke.mjs
      - name: Test service-worker offline route recovery
        run: node scripts/test-service-worker.mjs
      - name: Test resilience recovery behavior
        run: node scripts/test-resilience.mjs
      - name: Test client error-report version contracts
        run: node scripts/test-error-report-version.mjs
      - name: Test Doodhwala Pay payment-intent security
        run: node scripts/test-doodhwala-pay.mjs
      - name: Test Doodhwala Pay event ledger and state machine
        run: node scripts/test-doodhwala-pay-state.mjs
      - name: Simulate customer checkout and network retry
        run: node scripts/test-checkout-flow.mjs
      - name: Test direct seller UPI and COD contracts
        run: node scripts/test-direct-seller-payments.mjs
      - name: Test customer discovery enhancements
        run: node scripts/test-discovery-enhancements.mjs
      - name: Test product-detail null and price recovery
        run: node scripts/test-product-runtime.mjs
      - name: Test PWA registration diagnostics
        run: node scripts/test-pwa-registration.mjs
      - name: Test premium experience and connection feedback
        run: node scripts/test-experience-layer.mjs
      - name: Test admin cross-role realtime cache invalidation
        run: node scripts/test-admin-data-sync.mjs
      - name: Test security contracts
        run: node scripts/test-security-contracts.mjs
      - name: Test anonymous access hardening
        run: node scripts/test-anon-access-hardening.mjs
      - name: Test cross-account and provider authorization isolation
        run: node scripts/test-authorization-isolation.mjs
      - name: Test legal policy draft and navigation
        run: node scripts/test-legal-contracts.mjs
      - name: Test customer support centre and owner ticket triage
        run: node scripts/test-support-center.mjs
      - name: Test auth return paths and password recovery
        run: node scripts/test-auth-contracts.mjs
      - name: Test consolidated RLS policy contracts
        run: node scripts/test-policy-consolidation.mjs
      - name: Test private admin allowlist RLS
        run: node scripts/test-admin-allowlist-rls.mjs
      - name: Validate site asset contracts
        run: node scripts/validate-site.mjs
      - name: Reject accidental domain-root paths
        run: |
          set -e
          matches=$(grep -RInE 'href="/|src="/|location\.href="/|register\("/|start_url":"/' --include='*.html' --include='*.js' --include='*.webmanifest' . | grep -v '/Doodhwala/' || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "Found an absolute path that is not rooted at the Doodhwala GitHub Pages project."
            exit 1
          fi
