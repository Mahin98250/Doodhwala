name: Next.js app validation

on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/nextjs-app-validation.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/nextjs-app-validation.yml"

permissions:
  contents: read

concurrency:
  group: nextjs-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check and build Next.js app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Production route smoke checks
        run: npm run smoke
