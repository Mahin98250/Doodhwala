name: Next.js app validation

on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/nextjs-app-validation.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/nextjs-app-validation.yml"

permissions:
  contents: read

concurrency:
  group: nextjs-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check and build Next.js app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Export generated lockfile for repository pinning
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            echo LOCKFILE_BASE64_BEGIN
            base64 -w0 package-lock.json | fold -w 900 | sed "s/^/LOCKCHUNK:/"
            echo LOCKFILE_BASE64_END
          else
            echo "package-lock.json was not generated" >&2
            exit 1
          fi
      - name: Unit tests
        run: npm test
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
