name: Task
description: Create a trackable development task with a clear owner and acceptance criteria
title: "[TASK] "
labels: ["task"]
body:
  - type: input
    id: task-id
    attributes:
      label: Task ID
      description: Use an ID from TASK_BOARD.md (for example DW-001). For a new task, suggest the next unused DW number.
      placeholder: DW-008
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Goal / outcome
      description: What should be true when this task is complete?
      placeholder: Describe the result, not just the coding activity.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and boundaries
      description: Routes, files, or subsystem to inspect; also list what is out of scope.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Write observable, testable criteria. Use Markdown checkboxes.
      placeholder: |
        - [ ] Expected behavior works
        - [ ] Relevant checks pass
        - [ ] Manual testing is recorded
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Owner (GitHub username)
      description: One person is responsible for coordinating the task.
      placeholder: "@username"
    validations:
      required: false
  - type: input
    id: branch
    attributes:
      label: Working branch
      placeholder: "feat/short-task-name"
    validations:
      required: false
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies / blockers
      placeholder: "None, or list the staging access, decisions, or other tasks needed."
    validations:
      required: false
  - type: textarea
    id: verification
    attributes:
      label: Verification plan
      description: How will someone prove this is done?
    validations:
      required: true
